      <div class="msg hidden" id="cvAddMsg"></div>
    </div>
    <div class="card"><h2>Saved CVs</h2><div id="cvBankList"><p class="msg">Loading...</p></div></div>`;
  async function loadList() {
    const el = document.getElementById("cvBankList");
    const { data: cvs, error } = await sb.from("admin_cvs").select("*").order("created_at", { ascending: false });
    if (error) return (el.innerHTML = `<p class="msg error">Could not load CVs: ${esc(error.message)}</p>`);
    if (!cvs || !cvs.length) return (el.innerHTML = `<p class="msg">No CVs uploaded yet.</p>`);
    el.innerHTML = cvs.map((cv) => `
      <div class="list-item">
        <strong>${esc(cv.label || "Untitled CV")}</strong>
        <p class="msg muted" style="margin-top:2px;">${esc(cv.file_name || "")} · added ${esc(fmtDate(cv.created_at))}</p>
        <div class="row">
          ${cv.file_path ? `<button class="secondary small" data-open-cv="${esc(cv.file_path)}">Open</button>` : cv.file_url ? `<a class="plain small-text" href="${esc(safeUrl(cv.file_url))}" target="_blank" rel="noopener">Open (old upload)</a>` : ""}
          <button class="danger small" data-del-cv="${esc(cv.id)}" data-path="${esc(cv.file_path || "")}">Delete</button>
        </div>
      </div>`).join("");
    el.querySelectorAll("[data-open-cv]").forEach((b) => b.addEventListener("click", () => openPrivateFile(b.dataset.openCv).catch((e) => alert(e.message))));
    el.querySelectorAll("[data-del-cv]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("Delete this CV from the bank?")) return;
      if (b.dataset.path) await sb.storage.from("resumes").remove([b.dataset.path]);
      await sb.from("admin_cvs").delete().eq("id", b.dataset.delCv);
      loadList();
    }));
  }
  loadList();
  document.getElementById("addCvBtn").addEventListener("click", async () => {
    const file = document.getElementById("cvFile").files[0];
    const msg = document.getElementById("cvAddMsg");
    if (!file) return showMsg(msg, "Choose a CV file first.", "error");
    try {
      showMsg(msg, "Reading file...");
      const text = await extractTextFromFile(file);
      showMsg(msg, "Saving privately...");
      const path = await uploadPrivateFile(file, user.id, "cvbank");
      const { error } = await sb.from("admin_cvs").insert({
        admin_id: user.id,
        label: document.getElementById("cvLabel").value.trim() || file.name,
        resume_text: text,
        file_path: path,
        file_name: file.name,
      });
      if (error) throw error;
      showMsg(msg, "CV added.", "success");
      document.getElementById("cvLabel").value = "";
      document.getElementById("cvFile").value = "";
      loadList();
    } catch (err) {
      showMsg(msg, "Could not add CV: " + err.message, "error");
    }
  });
}

const CONTENT_TOOLS_MAX_WORDS = 50000;
const CONTENT_TOOLS_CHUNK_WORDS = 2500;

function chunkText(text, chunkSize) {
  const paragraphs = text.split(/\n\s*\n/);
  const chunks = [];
  let current = "";
  let currentWords = 0;
  for (const para of paragraphs) {
    const n = wordCount(para);
    if (currentWords + n > chunkSize && current) {
      chunks.push(current.trim());
      current = "";
      currentWords = 0;
    }
    current += para + "\n\n";
    currentWords += n;
    if (n > chunkSize) {
      const words = current.trim().split(/\s+/);
      current = "";
      currentWords = 0;
      for (let i = 0; i < words.length; i += chunkSize) chunks.push(words.slice(i, i + chunkSize).join(" "));
    }
  }
  if (current.trim()) chunks.push(current.trim());
  return chunks;
}

function downloadWord(text, filename) {
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const body = text.split("\n").map((line) => `<p style="margin:0 0 10px;font-family:Calibri,Arial,sans-serif;font-size:11pt;">${escapeHtml(line) || "&nbsp;"}</p>`).join("");
  const blob = htmlDocx.asBlob(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Document</title></head><body>${body}</body></html>`);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function renderContentTools(user) {
  if (!(await requireAdmin(user))) return;
  app.innerHTML = `
    ${topbar("Content Tools", "admin")}
    <div class="card">
      <p class="msg" style="margin-top:0;">Upload a file or paste text (up to ${CONTENT_TOOLS_MAX_WORDS.toLocaleString()} words). Nothing here is saved.</p>
      <label for="ctFileInput">Upload file (PDF, DOCX, or TXT)</label>
      <input type="file" id="ctFileInput" accept=".pdf,.docx,.txt" />
      <div class="msg hidden" id="ctExtractMsg"></div>
      <label for="ctText">Or paste text</label>
      <textarea id="ctText" rows="14"></textarea>
      <p class="msg" id="ctWordCount">0 words</p>
      <button id="ctDetectBtn">Scan for AI Patterns</button>
      <button class="secondary" id="ctHumanizeBtn">Humanize</button>
      <button class="secondary" id="ctParaphraseBtn">Paraphrase</button>
      <div class="msg hidden" id="ctProgressMsg"></div>
    </div>
    <div id="ctResults"></div>`;
  const ta = document.getElementById("ctText");
  const wc = document.getElementById("ctWordCount");
  const update = () => {
    const n = wordCount(ta.value);
    wc.className = n > CONTENT_TOOLS_MAX_WORDS ? "msg error" : "msg";
    wc.textContent = n > CONTENT_TOOLS_MAX_WORDS ? `${n.toLocaleString()} words — over the limit, please trim.` : `${n.toLocaleString()} words`;
  };
  ta.addEventListener("input", update);
  document.getElementById("ctFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const msg = document.getElementById("ctExtractMsg");
    if (!file) return;
    try {
      showMsg(msg, "Reading file...");
      ta.value = await extractTextFromFile(file);
      update();
      showMsg(msg, "File loaded below.", "success");
    } catch (err) {
      showMsg(msg, err.message, "error");
    }
  });
  const buttons = ["ctDetectBtn", "ctHumanizeBtn", "ctParaphraseBtn"].map((id) => document.getElementById(id));
  async function runTool(action, label) {
    const text = ta.value.trim();
    const progress = document.getElementById("ctProgressMsg");
    const out = document.getElementById("ctResults");
    if (!text) return showMsg(progress, "Add some text first.", "error");
    if (wordCount(text) > CONTENT_TOOLS_MAX_WORDS) return showMsg(progress, "Text is over the word limit.", "error");
    buttons.forEach((b) => (b.disabled = true));
    out.innerHTML = "";
    const chunks = chunkText(text, CONTENT_TOOLS_CHUNK_WORDS);
    try {
      if (action === "detect_ai") {
        let blended = 0;
        let model = 0;
        let flagged = [];
        for (let i = 0; i < chunks.length; i++) {
          showMsg(progress, `Scanning part ${i + 1} of ${chunks.length}...`);
          const data = await callFunction("tailor-resume", { action, text: chunks[i] });
          const r = JSON.parse(data.result);
          blended += r.ai_likelihood_percent || 0;
          model += r.model_judgment_percent || 0;
          flagged = flagged.concat((r.flagged_passages || []).map((f) => ({ ...f, part: i + 1 })));
        }
        progress.classList.add("hidden");
        const avg = Math.round(blended / chunks.length);
        out.innerHTML = `<div class="card"><h2>AI pattern scan</h2><p class="display" style="font-size:28px;margin:8px 0;">${avg}%</p><p class="msg muted">Model judgment ${Math.round(model / chunks.length)}%. A heuristic only, not proof either way.</p>
          ${flagged.map((f) => `<div class="card flat" style="margin-top:8px;"><p class="small-text" style="font-style:italic;margin:0 0 4px;">"${esc(f.excerpt)}"</p><p class="small-text muted" style="margin:0;">${esc(f.reason)}</p></div>`).join("")}</div>`;
      } else {
        let combined = "";
        for (let i = 0; i < chunks.length; i++) {
          showMsg(progress, `${label} part ${i + 1} of ${chunks.length}...`);
          const data = await callFunction("tailor-resume", { action, text: chunks[i] });
          combined += (i ? "\n\n" : "") + data.result;
        }
        progress.classList.add("hidden");
        COPY = new Map();
        out.innerHTML = `<div class="card"><div class="row between"><h2 style="margin:0;">${esc(label)} result</h2>${copyBtn(combined)}</div><p class="pre" style="margin-top:12px;">${esc(combined)}</p><button class="secondary" id="ctWordBtn">Download Word</button></div>`;
        document.getElementById("ctWordBtn").addEventListener("click", () => downloadWord(combined, `${label}_output.docx`));
      }
    } catch (err) {
      showMsgHtml(progress, errorHtml(err), "error");
    }
    buttons.forEach((b) => (b.disabled = false));
  }
  buttons[0].addEventListener("click", () => runTool("detect_ai", "Scan"));
  buttons[1].addEventListener("click", () => runTool("humanize", "Humanize"));
  buttons[2].addEventListener("click", () => runTool("paraphrase", "Paraphrase"));
}
