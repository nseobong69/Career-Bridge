<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Career Bridge</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #10151f;
    --ink-soft: #2a3244;
    --paper: #f5f3ee;
    --card: #ffffff;
    --line: #e4e0d6;
    --brass: #a67c3d;
    --brass-deep: #8a6530;
    --brass-tint: #f6ecd9;
    --success: #2f6b4f;
    --success-tint: #e6f1eb;
    --warn: #8a5a00;
    --warn-tint: #fbf0d9;
    --error: #b5433a;
    --error-tint: #f8e6e4;
    --info: #2b5a8a;
    --info-tint: #e5eef7;
    --muted: #6b7280;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(166,124,61,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(16,21,31,0.04), transparent 40%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 28px 18px 48px; }
  .container.wide { max-width: 760px; }

  h1, .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
  h1 { font-size: 26px; margin: 0 0 6px; font-weight: 500; color: var(--ink); }
  h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; letter-spacing: -0.005em; }
  h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  p.subtitle { color: var(--muted); margin: 0 0 26px; font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(16,21,31,0.03), 0 8px 24px -18px rgba(16,21,31,0.25);
  }
  .card.flat { box-shadow: none; padding: 16px; }

  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 14px 0 6px; }
  label.inline { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 14px; color: #555; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 15px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea { line-height: 1.5; resize: vertical; }
  input[type="checkbox"] { width: auto; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(166,124,61,0.15); }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: var(--ink);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.01em;
    margin-top: 16px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { box-shadow: 0 6px 16px -8px rgba(16,21,31,0.45); }
  button:active { transform: translateY(1px); }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  button.secondary:hover { border-color: var(--brass); background: var(--brass-tint); box-shadow: none; }
  button.brass { background: linear-gradient(180deg, var(--brass) 0%, var(--brass-deep) 100%); color: #fff; }
  button.small { width: auto; padding: 7px 12px; font-size: 12.5px; margin-top: 0; }
  button.danger { background: transparent; color: var(--error); border: 1px solid var(--line); }
  button:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }

  .msg { font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .msg.warn { color: var(--warn); }
  .muted { color: var(--muted); }
  .small-text { font-size: 12.5px; }
  .link { text-align: center; font-size: 14px; margin-top: 18px; color: var(--muted); }
  .link a, a.plain { color: var(--brass-deep); text-decoration: none; font-weight: 600; }
  .link a:hover, a.plain:hover { text-decoration: underline; }
  .hidden { display: none !important; }

  .progress-bar { background: var(--line); border-radius: 999px; height: 8px; overflow: hidden; margin: 8px 0; }
  .progress-fill { background: linear-gradient(90deg, var(--brass) 0%, var(--brass-deep) 100%); height: 100%; transition: width 0.4s ease; }

  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .topbar h1 { margin: 0; font-size: 20px; }
  .topbar button { width: auto; padding: 8px 16px; font-size: 12.5px; margin: 0; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.between { justify-content: space-between; }
  .row > button { margin-top: 0; }
  .stack > * + * { margin-top: 8px; }

  .nav-tile { display: block; text-decoration: none; color: inherit; }
  .nav-tile .card { display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: border-color 0.15s ease, transform 0.1s ease; }
  .nav-tile:hover .card { border-color: var(--brass); }
  .nav-tile .card::after { content: "→"; color: var(--brass-deep); font-family: 'Fraunces', serif; font-size: 18px; }
  .nav-tile .card h2 { margin-bottom: 4px; }
  .nav-tile .card .msg { margin-top: 0; }

  .eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brass-deep); margin: 0 0 4px; }

  .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
  .chip.good { background: var(--success-tint); color: var(--success); }
  .chip.warn { background: var(--warn-tint); color: var(--warn); }
  .chip.bad { background: var(--error-tint); color: var(--error); }
  .chip.info { background: var(--info-tint); color: var(--info); }
  .chip.plain { background: #f1efe8; color: var(--ink-soft); }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 4px; }
  .score { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
  .score .num { font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 500; }
  .score .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .list-item { border-top: 1px solid var(--line); padding: 10px 0; }
  .list-item:first-child { border-top: none; padding-top: 0; }
  .crit { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .crit:first-child { border-top: none; }
  .crit .note { grid-column: 2; color: var(--muted); font-size: 12.5px; }

  details > summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  details[open] > summary { margin-bottom: 8px; }
  .pre { white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
  .section-text { min-height: 140px; font-size: 14px; }
  .banner { border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .banner.warn { background: var(--warn-tint); color: var(--warn); }
  .banner.info { background: var(--info-tint); color: var(--info); }
  .banner.bad { background: var(--error-tint); color: var(--error); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }
  .kv:first-child { border-top: none; }

  ::selection { background: var(--brass-tint); color: var(--ink); }
  @media (max-width: 420px) {
    .scores { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .score .num { font-size: 20px; }
    .card { padding: 18px; }
  }
</style>

<script>
// ============================================================
// CONFIG — your Supabase project (Dashboard -> Settings -> API)

const SUPABASE_URL = "https://spdyhkjlkjzqlnwlsahj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_D-_pOmWv7DvL0OoDOMTzZA_g4PBTvIt";
const APP_VERSION = "2.0.0";

const TAILOR_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/tailor-resume`;
const VERIFY_PAYMENT_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/verify-payment`;

// Paystack's PUBLIC key is safe to expose in the browser.
const PAYSTACK_PUBLIC_KEY = "YOUR_PAYSTACK_PUBLIC_KEY";

// ============================================================
// Login storage: "Remember me" keeps you signed in after closing
// the browser (localStorage); unticked lasts for this tab only.
// ============================================================
const rememberAwareStorage = {
  getItem: (key) => localStorage.getItem(key) || sessionStorage.getItem(key),
  setItem: (key, value) => {
    const remember = localStorage.getItem("cb_remember") !== "false";
    if (remember) {
      localStorage.setItem(key, value);
      sessionStorage.removeItem(key);
    } else {
      sessionStorage.setItem(key, value);
      localStorage.removeItem(key);
    }
  },
  removeItem: (key) => {
    localStorage.removeItem(key);
    sessionStorage.removeItem(key);
  },
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: rememberAwareStorage },
});

// ============================================================
// Small helpers
// ============================================================
const app = document.getElementById("app");
const DEVICE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "phone" : "laptop";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(u) {
  try {
    const x = new URL(String(u));
    return /^https?:$/.test(x.protocol) ? x.href : "#";
  } catch { return "#"; }
}
function wordCount(s) {
  const t = String(s ?? "").trim();
  return t ? t.split(/\s+/).length : 0;
}
function fmtDate(d) {
  if (!d) return "";
  const x = new Date(String(d).length === 10 ? d + "T12:00:00" : d);
  return isNaN(x) ? String(d) : x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function fmtMonth(d) {
  if (!d) return "";
  const x = new Date(String(d).slice(0, 7) + "-15T12:00:00");
  return isNaN(x) ? "" : x.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
}
function timeAgo(iso) {
  if (!iso) return "";
  const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return fmtDate(iso);
}
function showMsg(el, text, kind = "") {
  if (!el) return;
  el.className = "msg" + (kind ? " " + kind : "");
  el.textContent = text;
  el.classList.remove("hidden");
}
function showMsgHtml(el, html, kind = "") {
  if (!el) return;
  el.className = "msg" + (kind ? " " + kind : "");
  el.innerHTML = html;
  el.classList.remove("hidden");
}
function topbar(title, back = "dashboard") {
  return `<div class="topbar"><h1>${esc(title)}</h1><button class="secondary" data-nav="${esc(back)}">Back</button></div>`;
}
function setWide(on) {
  app.classList.toggle("wide", !!on);
}
function stripMarkdown(text) {
  return text ? String(text).replace(/^#{1,6}\s*/gm, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1") : text;
}
function monthToDate(m) {
  return /^\d{4}-\d{2}$/.test(m || "") ? `${m}-01` : null;
}
function toArr(s) {
  return String(s || "").split(",").map((x) => x.trim()).filter(Boolean);
}
// A message that survives the page re-drawing itself (shown as a banner).
// It stays on the page it was made for, for a few seconds, and goes away
// when you move to another page.
let FLASH = null;
function setFlash(text, kind = "info", route = window.location.hash) {
  FLASH = { text, kind, route, at: Date.now() };
}
function takeFlash() {
  if (!FLASH) return null;
  if (FLASH.route !== window.location.hash || Date.now() - FLASH.at > 15000) {
    FLASH = null;
    return null;
  }
  return FLASH;
}
function flashBanner() {
  const f = takeFlash();
  if (!f) return "";
  const html = esc(f.text) + (/credit/i.test(f.text) && f.kind === "warn" ? ' <a class="plain" href="#billing">Go to Billing</a>' : "");
  return `<div class="banner ${f.kind === "success" ? "info" : esc(f.kind)}" id="flash">${html}</div>`;
}

// One delegated handler for every "Back"/nav button and Copy button.
let COPY = new Map();
let copySeq = 0;
function copyBtn(text, label = "Copy") {
  const id = "c" + ++copySeq;
  COPY.set(id, String(text ?? ""));
  return `<button type="button" class="secondary small" data-copy="${id}">${esc(label)}</button>`;
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch { /* fall back below */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch { return false; }
}
document.addEventListener("click", async (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    e.preventDefault();
    window.location.hash = nav.dataset.nav;
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    e.preventDefault();
    const text = COPY.get(c.dataset.copy) ?? "";
    const ok = await copyText(text);
    const original = c.textContent;
    c.textContent = ok ? "Copied ✓" : "Copy failed";
    setTimeout(() => { c.textContent = original; }, 1400);
  }
});

// Calls one of our Edge Functions with the signed-in user's token.
async function callFunction(name, body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const e = new Error("Please log in again.");
    e.status = 401;
    throw e;
  }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
      apikey: SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body || {}),
  });
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok || (data && data.error)) {
    const e = new Error((data && data.error) || `Request failed (HTTP ${res.status})`);
    e.status = res.status;
    e.code = data && data.code;
    e.data = data;
    throw e;
  }
  return data;
}
const engine = (action, body = {}) => callFunction("apply-engine", { action, ...body });

// Friendly text for an error, with a Billing link when credits ran out.
function errorHtml(err) {
  const text = esc(err && err.message ? err.message : String(err));
  if (err && (err.status === 402 || err.code === "limit_reached")) return `${text} <a class="plain" href="#billing">Go to Billing</a>`;
  if (err && err.status === 401) return `${text} <a class="plain" href="#login">Log in</a>`;
  return text;
}

async function myUsage() {
  const { data, error } = await sb.rpc("cb_get_my_usage");
  return error ? null : data;
}
function usageText(u) {
  if (!u) return "";
  if (u.unlimited) return "Unlimited AI credits";
  return `${u.used} of ${u.limit} AI credits used this month`;
}

const ELIG = { pass: ["good", "Eligible"], review: ["warn", "Check eligibility"], fail: ["bad", "Not eligible"] };
const REC = { high_priority: ["good", "High priority"], apply: ["good", "Apply"], conditional: ["warn", "Maybe"], skip: ["bad", "Skip"] };
const PKG = { ready: ["good", "Ready to submit"], needs_work: ["warn", "Needs work"], draft: ["plain", "Draft"], submitted: ["info", "Submitted"] };
const RATING = { strong: ["good", "Strong"], met: ["good", "Met"], partial: ["warn", "Partial"], missing: ["bad", "Missing"] };
const chip = (map, key, fallback = "—") => {
  const [cls, label] = map[key] || ["plain", fallback];
  return `<span class="chip ${cls}">${esc(label)}</span>`;
};

// ============================================================
// Reading files the user uploads (CV, job description)
// ============================================================
async function extractTextFromFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      let line = "";
      let lastY = null;
      for (const item of content.items) {
        const y = item.transform ? item.transform[5] : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) {
          text += line.trimEnd() + "\n";
          line = "";
        }
        line += item.str + (item.hasEOL ? "\n" : " ");
        lastY = y;
      }
      text += line.trimEnd() + "\n";
    }
    return text.replace(/\n{3,}/g, "\n\n").trim();
  }
  if (name.endsWith(".docx")) {
    const buffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buffer });
    return result.value.trim();
  }
  if (name.endsWith(".doc")) throw new Error("Old .doc files aren't supported. Save it as .docx or .pdf and try again.");
  return (await file.text()).trim();
}

// CVs go into the private "resumes" storage bucket, in your own folder.
async function uploadPrivateFile(file, userId, folder = "") {
  const safe = file.name.replace(/[^a-zA-Z0-9._-]+/g, "_").slice(-80);
  const path = `${userId}/${folder ? folder + "/" : ""}${Date.now()}-${safe}`;
  const { error } = await sb.storage.from("resumes").upload(path, file, { upsert: false, contentType: file.type || "application/octet-stream" });
  if (error) throw new Error(`Upload failed: ${error.message}`);
  return path;
}
async function openPrivateFile(path) {
  const { data, error } = await sb.storage.from("resumes").createSignedUrl(path, 300);
  if (error || !data) throw new Error(error ? error.message : "Could not open the file");
  window.open(data.signedUrl, "_blank");
}

// ============================================================
// Router: #login, #dashboard, #job/<id>, #package/<id> ...
// ============================================================
let pollTimer = null;
let onVisible = null;
function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  if (onVisible) document.removeEventListener("visibilitychange", onVisible);
  onVisible = null;
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    window.location.hash = "reset-password";
    render();
  }
});

const PUBLIC_ROUTES = ["login", "signup", "forgot-password", "reset-password"];
const WIDE_ROUTES = ["evidence", "job", "package", "queue", "add-job", "jobs", "tracker", "admin", "match", "interview", "content-tools"];

// One page draw at a time: if you click again while a page is still
// loading, the newest request is drawn once the current one finishes, so
// a slow older page can never cover a newer one.
let rendering = null;
let renderAgain = false;
function render() {
  if (rendering) {
    renderAgain = true;
    return rendering;
  }
  rendering = (async () => {
    do {
      renderAgain = false;
      await renderNow();
    } while (renderAgain);
  })().finally(() => { rendering = null; });
  return rendering;
}

async function renderNow() {
  stopPolling();
  COPY = new Map();
  const { data: { user } } = await sb.auth.getUser();
  const [route, param] = (window.location.hash.replace("#", "") || (user ? "dashboard" : "login")).split("/");
  setWide(WIDE_ROUTES.includes(route));

  if (!user && !PUBLIC_ROUTES.includes(route)) {
    window.location.hash = "login";
    return renderLogin();
  }
  try {
    switch (route) {
      case "signup": return renderSignup();
      case "forgot-password": return renderForgotPassword();
      case "reset-password": return renderResetPassword();
      case "login": return user ? renderDashboard(user) : renderLogin();
      case "dashboard": return renderDashboard(user);
      case "profile": return renderProfile(user);
      case "evidence": return renderEvidence(user);
      case "match": return renderMatch(user);
      case "jobs": return renderJobs(user);
      case "add-job": return renderAddJob(user);
      case "job": return renderJob(user, param);
      case "queue": return renderQueue(user);
      case "package": return renderPackage(user, param);
      case "tracker": return renderTracker(user);
      case "interview": return renderInterview(user);
      case "billing": return renderBilling(user);
      case "admin": return renderAdmin(user);
      case "cv-bank": return renderCvBank(user);
      case "content-tools": return renderContentTools(user);
      default: return renderDashboard(user);
    }
  } catch (err) {
    console.error(err);

function passwordToggle(inputId) {
  document.getElementById("togglePassword").addEventListener("click", (e) => {
    const pw = document.getElementById(inputId);
    const hidden = pw.type === "password";
    pw.type = hidden ? "text" : "password";
    e.target.textContent = hidden ? "Hide" : "Show";
  });
}
const PW_FIELD = (id, extra = "") => `
  <div style="position:relative;">
    <input type="password" id="${id}" ${extra} required style="padding-right:64px;" />
    <button type="button" id="togglePassword" style="position:absolute;right:6px;top:6px;width:auto;margin:0;padding:6px 10px;font-size:12px;background:#f0f0f0;color:#111;">Show</button>
  </div>`;

function renderLogin() {
  app.innerHTML = `

      <h1>Career Bridge</h1>
      <p class="subtitle">Your AI Career Copilot</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
        <label for="password">Password</label>
        ${PW_FIELD("password", 'autocomplete="current-password"')}
        <label class="inline" style="margin-top:14px;"><input type="checkbox" id="rememberMe" checked /> Remember me</label>
        <div class="msg error hidden" id="loginMsg"></div>
        <button type="submit" id="loginBtn">Log In</button>

      <p class="link"><a href="#forgot-password">Forgot password?</a></p>
      <p class="link">No account? <a href="#signup">Sign up</a></p>

  passwordToggle("password");
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMsg");
    btn.disabled = true;
    btn.textContent = "Logging in...";
    localStorage.setItem("cb_remember", document.getElementById("rememberMe").checked ? "true" : "false");

function field(name, label, value, type = "text", extra = "") {

function selectField(name, label, value, options) {
  return `<label for="${name}">${esc(label)}</label>

        ${selectField("has_driving_licence", "Full driving licence", licence, ["Yes", "No"])}
        ${selectField("security_clearance", "Security clearance you hold", v.security_clearance || "", CLEARANCE_OPTIONS)}

        <p class="eyebrow" style="margin-top:22px;">What you're looking for</p>
        ${field("preferred_countries", "Preferred countries (comma-separated)", arr(v.preferred_countries))}
        ${field("preferred_salary", "Preferred salary", v.preferred_salary)}
        ${selectField("preferred_job_type", "Preferred job type", v.preferred_job_type, JOB_TYPE_OPTIONS)}

        ${field("education", "Education (short summary)", v.education)}
        ${field("skills", "Skills (comma-separated)", arr(v.skills))}
        ${field("years_of_experience", "Years of experience", v.years_of_experience, "number", 'min="0" max="60"')}
        ${selectField("availability", "Availability", v.availability, AVAILABILITY_OPTIONS)}
        ${field("preferred_industries", "Preferred industries (comma-separated)", arr(v.preferred_industries))}
        ${field("preferred_roles", "Preferred roles (comma-separated)", arr(v.preferred_roles))}
        <div class="msg hidden" id="saveMsg"></div>
        <button type="submit" id="saveBtn">Save Profile</button>
      </form>
    </div>

    <div class="card">
      <h2>Your CV</h2>
      <div id="cvCurrent"></div>
      <label for="resumeFile">Upload CV (PDF or Word .docx)</label>
      <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" />
      <button class="secondary" id="uploadBtn">Upload</button>
      <div class="msg hidden" id="uploadMsg"></div>
      <p class="msg muted">Your CV is stored privately: only you can open it. After uploading, use <a class="plain" href="#evidence">Evidence Bank → Import from CV</a> to fill your evidence bank quickly.</p>
    </div>`;

  const cvCurrent = document.getElementById("cvCurrent");
  if (v.resume_file_path) {
    cvCurrent.innerHTML = `<p class="msg success">Saved: ${esc(v.resume_file_name || "CV")} <button type="button" class="secondary small" id="openCv">Open</button></p>`;
    document.getElementById("openCv").addEventListener("click", () => openPrivateFile(v.resume_file_path).catch((e) => alert(e.message)));
  } else if (v.resume_file_url) {
    cvCurrent.innerHTML = `<p class="msg">Older upload: <a class="plain" href="${esc(safeUrl(v.resume_file_url))}" target="_blank" rel="noopener">${esc(v.resume_file_name || "resume")}</a>. Upload again to store it privately.</p>`;
  } else if (v.resume_text) {
    cvCurrent.innerHTML = `<p class="msg">CV text saved (${wordCount(v.resume_text)} words), no file stored.</p>`;
  } else {
    cvCurrent.innerHTML = `<p class="msg">No CV saved yet.</p>`;
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("saveBtn");
    const msg = document.getElementById("saveMsg");
    btn.disabled = true;
    btn.textContent = "Saving...";
    const get = (id) => document.getElementById(id).value.trim();
    const lic = get("has_driving_licence");
    const fields = {
      full_name: get("full_name"),
      phone: get("phone"),
      address_line1: get("address_line1"),
      address_line2: get("address_line2"),
      city: get("city"),
      state: get("state"),
      postal_code: get("postal_code"),
      country: get("country"),
      current_location: get("current_location"),
      nationality: get("nationality"),
      work_authorization: get("work_authorization"),
      registrations: toArr(get("registrations")),
      has_driving_licence: lic === "Yes" ? true : lic === "No" ? false : null,
      security_clearance: get("security_clearance") || null,
      languages: toArr(get("languages")),
      notice_period: get("notice_period"),
      preferred_countries: toArr(get("preferred_countries")),
      preferred_salary: get("preferred_salary"),
      preferred_job_type: get("preferred_job_type"),
      remote_or_hybrid: get("remote_or_hybrid"),
      experience_level: get("experience_level"),
      education: get("education"),
      skills: toArr(get("skills")),
      years_of_experience: get("years_of_experience") ? Number(get("years_of_experience")) : null,
      availability: get("availability"),
      preferred_industries: toArr(get("preferred_industries")),
      preferred_roles: toArr(get("preferred_roles")),
    };
    const counted = ["full_name", "phone", "city", "country", "work_authorization", "languages", "education", "skills", "years_of_experience", "preferred_roles", "availability", "postal_code"];
    const filled = counted.filter((k) => {
      const x = fields[k];
      return x !== null && x !== undefined && (Array.isArray(x) ? x.length : String(x).trim());
    }).length;
    fields.profile_completion_percent = Math.round((filled / counted.length) * 100);
    fields.updated_at = new Date().toISOString();
    const { error } = await sb.from("profiles").update(fields).eq("id", user.id);
    btn.disabled = false;
    btn.textContent = "Save Profile";
    showMsg(msg, error ? error.message : "Profile saved.", error ? "error" : "success");
  });

  document.getElementById("uploadBtn").addEventListener("click", async () => {
    const file = document.getElementById("resumeFile").files[0];
    const msg = document.getElementById("uploadMsg");
    if (!file) return showMsg(msg, "Choose a file first.", "error");
    try {
      showMsg(msg, "Reading file...");
      const text = await extractTextFromFile(file);
      showMsg(msg, "Saving privately...");
      const path = await uploadPrivateFile(file, user.id, "cv");
      const { error } = await sb.from("profiles").update({ resume_text: text, resume_file_path: path, resume_file_name: file.name }).eq("id", user.id);
      if (error) throw error;
      showMsg(msg, `CV saved (${wordCount(text)} words read). Next: Evidence Bank → Import from CV.`, "success");
      setTimeout(() => { if (window.location.hash === "#profile") render(); }, 900);
    } catch (err) {
      showMsg(msg, "Upload failed: " + err.message, "error");
    }
  });
}

async function renderJobs(user) {
  const { data: profile } = await sb.from("profiles").select("is_admin").eq("id", user.id).maybeSingle();
  const isAdmin = !!profile?.is_admin;

  app.innerHTML = `
    ${topbar("Find Jobs")}
    <div class="row" style="margin:-6px 0 14px;"><button class="brass small" data-nav="add-job">+ Add a job yourself</button></div>

    ${isAdmin ? `
      <div class="card">
        <button id="fetchBtn">Fetch Latest Jobs (Admin)</button>
        <div class="msg hidden" id="fetchMsg"></div>
      </div>
      <div class="card">
        <label for="customSourceUrl">Add a custom job search URL (e.g. HealthJobsUK sector/region search)</label>
        <input type="text" id="customSourceUrl" placeholder="https://www.healthjobsuk.com/job_list?..." />
        <input type="text" id="customSourceLabel" placeholder="Label (optional, e.g. Apprenticeships)" style="margin-top:6px;" />
        <button class="secondary" id="addCustomSourceBtn" style="margin-top:8px;">Add Source</button>
        <div class="msg hidden" id="customSourceMsg"></div>
        <div id="customSourcesList" style="margin-top:12px;"></div>
      </div>` : ""}

    <div class="card">
      <label for="keywordSearch">Search (title, employer, location)</label>
      <input type="text" id="keywordSearch" placeholder="e.g. complaints, communications, analyst" />
      <div class="grid-2">
        <div>
          <label for="sourceFilter">Source</label>
          <select id="sourceFilter">
            <option value="">All sources</option>
            <option value="nhs_jobs">NHS Jobs</option>
            <option value="healthjobsuk">HealthJobsUK</option>
            <option value="trac">Trac</option>
            <option value="civil_service">Civil Service Jobs</option>
            <option value="captured">Added by me</option>
            <option value="adzuna">Adzuna</option>
            <option value="remoteok">RemoteOK</option>
            <option value="arbeitnow">Arbeitnow</option>
            <option value="jobicy">Jobicy</option>
          </select>
        </div>
        <div>
          <label for="sponsorFilter">Sponsorship</label>
          <select id="sponsorFilter">
            <option value="">All jobs</option>
            <option value="sponsor">Licensed sponsor only</option>
          </select>
        </div>
      </div>
      <label for="locationFilter">Location</label>
      <input type="text" id="locationFilter" placeholder="e.g. UK, London, Remote, Lagos" />
    </div>
    <div id="jobsList"></div>
    <div id="loadMoreWrap"></div>`;

  let currentPage = 0;
  const PAGE_SIZE = 30;
  let loaded = [];
  const $ = (id) => document.getElementById(id);
  const debounce = (fn, ms = 400) => {
    let t;
    return () => { clearTimeout(t); t = setTimeout(fn, ms); };
  };
  const reload = () => { currentPage = 0; loadJobsList(false); };
  $("sourceFilter").addEventListener("change", reload);
  $("sponsorFilter").addEventListener("change", reload);
  $("locationFilter").addEventListener("input", debounce(reload));
  $("keywordSearch").addEventListener("input", debounce(reload));

  if (isAdmin) {
    $("fetchBtn").addEventListener("click", async () => {
      const btn = $("fetchBtn");
      const msg = $("fetchMsg");
      btn.disabled = true;
      btn.textContent = "Fetching...";
      showMsg(msg, "Pulling the latest listings (up to 2 minutes)...");
      try {
        const data = await callFunction("fetch-jobs", {});
        const bs = data.by_source || {};
        const lines = Object.keys(bs).map((k) => {
          const s = bs[k] || {};
          if (s.skipped) return `${esc(k)}: skipped (${esc(s.skipped === true ? "missing keys" : s.skipped)})`;
          return `${esc(k)}: ${s.fetched || 0} fetched / ${s.upserted || 0} saved`;
        });
        showMsgHtml(msg, `Fetched ${data.fetched}, saved ${data.upserted}, ${data.sponsorMatched || 0} sponsor matches.<br><small>${lines.join("<br>")}</small>`, "success");
      } catch (err) {
        showMsgHtml(msg, errorHtml(err), "error");
      }
      btn.disabled = false;
      btn.textContent = "Fetch Latest Jobs (Admin)";
      reload();
    });

    const loadCustomSources = async () => {
      const listEl = $("customSourcesList");
      const { data: sources } = await sb.from("custom_job_sources").select("*").order("created_at", { ascending: false });
      if (!sources || !sources.length) {
        listEl.innerHTML = `<p class="msg muted small-text">No custom sources added yet.</p>`;
        return;
      }
      listEl.innerHTML = sources.map((s) => `
        <div class="row between list-item small-text">
          <div style="overflow:hidden;text-overflow:ellipsis;max-width:75%;"><strong>${esc(s.label || "(no label)")}</strong>${s.active ? "" : " (paused)"}<br><span class="muted">${esc(s.url)}</span>${s.last_fetched_at ? `<br><span class="muted">Last fetch: ${esc(s.last_fetch_count ?? 0)} jobs</span>` : ""}</div>
          <button class="secondary small" data-remove-source="${esc(s.id)}">Remove</button>
        </div>`).join("");
      listEl.querySelectorAll("[data-remove-source]").forEach((b) => b.addEventListener("click", async () => {
        await sb.from("custom_job_sources").delete().eq("id", b.dataset.removeSource);
        loadCustomSources();
      }));
    };
    loadCustomSources();
    $("addCustomSourceBtn").addEventListener("click", async () => {
      const url = $("customSourceUrl").value.trim();
      const label = $("customSourceLabel").value.trim();
      const msg = $("customSourceMsg");
      if (!/^https?:\/\//.test(url)) return showMsg(msg, "Paste a valid URL starting with http:// or https://", "error");
      const { error } = await sb.from("custom_job_sources").insert({ url, label: label || null });
      if (error) return showMsg(msg, "Failed to add: " + error.message, "error");
      showMsg(msg, "Source added. It's included the next time jobs are fetched.", "success");
      $("customSourceUrl").value = "";
      $("customSourceLabel").value = "";
      loadCustomSources();
    });
  }

  async function loadJobsList(append) {
    const listEl = $("jobsList");
    const more = $("loadMoreWrap");
    if (!append) listEl.innerHTML = `<p class="msg">Loading jobs...</p>`;
    const source = $("sourceFilter").value;
    const sponsorOnly = $("sponsorFilter").value === "sponsor";
    const loc = $("locationFilter").value.trim().replace(/[,()]/g, " ");
    const kw = $("keywordSearch").value.trim().replace(/[,()]/g, " ");
    let query = sb.from("jobs").select("id,title,company,location,salary,source,url,is_licensed_sponsor,sponsor_match_confidence,closing_date,description_source,sector").order("posted_at", { ascending: false });
    if (source) query = query.eq("source", source);
    if (sponsorOnly) query = query.eq("is_licensed_sponsor", true);
    if (loc) query = query.ilike("location", `%${loc}%`);
    if (kw) query = query.or(`title.ilike.%${kw}%,company.ilike.%${kw}%,location.ilike.%${kw}%,category.ilike.%${kw}%`);
    query = query.range(currentPage * PAGE_SIZE, currentPage * PAGE_SIZE + PAGE_SIZE - 1);
    const { data: jobs, error } = await query;
    if (error) {
      listEl.innerHTML = `<p class="msg error">${esc(error.message)}</p>`;
      return;
    }
    const fresh = jobs || [];
    loaded = append ? [...loaded, ...fresh] : fresh;
    if (!loaded.length) {
      listEl.innerHTML = `<div class="card"><p class="msg">No jobs match yet. Try another search, or <a class="plain" href="#add-job">add a job yourself</a>.</p></div>`;
      more.innerHTML = "";
      return;
    }
    const ids = loaded.map((j) => j.id);
    const { data: assessments } = await sb.from("job_assessments").select("job_id,fit_score,eligibility,recommendation").eq("user_id", user.id).in("job_id", ids);
    const byJob = new Map((assessments || []).map((a) => [String(a.job_id), a]));
    listEl.innerHTML = loaded.map((job) => {
      const a = byJob.get(String(job.id));
      return `
        <div class="card">
          <h2 style="margin-bottom:6px;">${esc(job.title)}</h2>
          <p class="msg" style="margin-top:0;">${esc(job.company || "")}${job.location ? " · " + esc(job.location) : ""}${job.salary ? " · " + esc(job.salary) : ""}</p>
          <div class="row" style="margin-top:6px;">
            <span class="chip plain">${esc(job.source)}</span>
            ${job.is_licensed_sponsor ? `<span class="chip good">Licensed sponsor${job.sponsor_match_confidence === "fuzzy" ? " (approx.)" : ""}</span>` : ""}
            ${job.closing_date ? `<span class="chip plain">Closes ${esc(fmtDate(job.closing_date))}</span>` : ""}
            ${a ? `${chip(ELIG, a.eligibility)} ${a.fit_score !== null && a.fit_score !== undefined ? `<span class="chip info">Fit ${esc(a.fit_score)}%</span>` : ""} ${chip(REC, a.recommendation)}` : ""}
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="${a ? "secondary" : ""} small" data-nav="job/${esc(job.id)}">${a ? "Open" : "Analyse"}</button>
            <a class="plain small-text" href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener">View original listing →</a>
          </div>
        </div>`;
    }).join("");
    if (fresh.length === PAGE_SIZE) {
      more.innerHTML = `<button class="secondary" id="loadMoreBtn" style="margin:12px 0;">Load More</button>`;
      $("loadMoreBtn").addEventListener("click", () => { currentPage++; loadJobsList(true); });
    } else more.innerHTML = "";
  }

  loadJobsList(false);
}

function renderAddJob(user) {
  app.innerHTML = `
    ${topbar("Add a Job", "jobs")}
    <div class="card">
      <p class="msg" style="margin-top:0;">On a laptop, the Career Bridge Chrome extension does this in one click from the advert page. On your phone: open the advert, select all the text, copy it, and paste it below.</p>
      <form id="addForm">
        ${field("aj_url", "Link to the advert *", "", "url", 'required placeholder="https://www.jobs.nhs.uk/candidate/jobadvert/..."')}
        ${field("aj_title", "Job title", "")}
        ${field("aj_company", "Employer", "")}
        <label for="aj_text">The whole advert text, including the person specification *</label>
        <textarea id="aj_text" rows="12" placeholder="Paste the full advert here"></textarea>
        <p class="msg muted small-text" id="aj_count">0 words</p>
        <label for="aj_file">Or add the job description / person specification document (PDF or Word)</label>
        <input type="file" id="aj_file" accept=".pdf,.docx,.txt" />
        <div class="msg hidden" id="ajMsg"></div>
        <button type="submit" id="ajBtn">Save and analyse (1–2 credits)</button>
      </form>
    </div>`;
  const $ = (id) => document.getElementById(id);
  const count = () => { $("aj_count").textContent = `${wordCount($("aj_text").value)} words`; };
  $("aj_text").addEventListener("input", count);
  $("aj_file").addEventListener("change", async () => {
    const file = $("aj_file").files[0];
    if (!file) return;
    try {
      showMsg($("ajMsg"), "Reading the document...");
      const text = await extractTextFromFile(file);
      $("aj_text").value = ($("aj_text").value.trim() + "\n\n" + text).trim();
      count();
      showMsg($("ajMsg"), `Added ${wordCount(text)} words from ${file.name}.`, "success");
    } catch (err) {
      showMsg($("ajMsg"), err.message, "error");
    }
  });
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("ajMsg");
    const text = $("aj_text").value.trim();
    if (wordCount(text) < 40) return showMsg(msg, "Paste the whole advert, including the person specification (at least a few paragraphs).", "error");
    $("ajBtn").disabled = true;
    try {
      showMsg(msg, "Saving the advert...");
      const cap = await engine("capture_job", { url: $("aj_url").value.trim(), title: $("aj_title").value.trim(), company: $("aj_company").value.trim(), text });
      showMsg(msg, "Checking eligibility and scoring each criterion (about 30 seconds)...");
      try {
        await engine("assess", { job_id: cap.job.id });
      } catch (err) {
        if (err.status !== 402) throw err;
        setFlash(err.message, "warn", `#job/${cap.job.id}`);
      }
      window.location.hash = `job/${cap.job.id}`;
    } catch (err) {
      showMsgHtml(msg, errorHtml(err), "error");
      $("ajBtn").disabled = false;
    }
  });
}

    sb.from("job_criteria").select("*").eq("job_id", jobId).maybeSingle(),
    sb.from("job_assessments").select("*").eq("user_id", user.id).eq("job_id", jobId).maybeSingle(),
    sb.from("application_packages").select("id,status,readiness_score,updated_at").eq("user_id", user.id).eq("job_id", jobId).maybeSingle(),
  ]);
  const body = document.getElementById("jobBody");
  if (!job) {
    body.innerHTML = `<div class="card"><p class="msg error">That job wasn't found.</p></div>`;
    return;
  }
  const banner = flashBanner();
  const full = job.description_source === "full";
  const reasons = assess?.eligibility_reasons || [];
  const results = assess?.criteria_results || [];
  const summary = assess?.evidence_snapshot?.summary;

  body.innerHTML = `
    ${banner}
    <div class="card">
      <p class="eyebrow">${esc(job.sector === "civil_service" ? "Civil Service" : job.sector === "nhs" ? "NHS" : job.source)}</p>
      <h1 style="font-size:22px;">${esc(job.title)}</h1>
      <p class="msg" style="margin-top:2px;">${esc(job.company || "")}${job.location ? " · " + esc(job.location) : ""}${job.salary ? " · " + esc(job.salary) : ""}</p>
      <div class="row" style="margin-top:8px;">
        ${job.closing_date ? `<span class="chip ${job.closing_date < new Date().toISOString().slice(0, 10) ? "bad" : "plain"}">Closes ${esc(fmtDate(job.closing_date))}</span>` : ""}
        ${job.is_licensed_sponsor ? `<span class="chip good">Licensed sponsor${job.sponsor_match_confidence === "fuzzy" ? " (approx.)" : ""}</span>` : ""}
        ${job.sponsorship_status === "welcome" ? `<span class="chip good">Advert welcomes sponsorship</span>` : job.sponsorship_status === "not_available" ? `<span class="chip bad">Advert: no sponsorship</span>` : ""}
      </div>
      <p style="margin:12px 0 0;"><a class="plain" href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener">Open the advert →</a></p>
    </div>

    <div class="card" id="advertCard">
      <h2>The advert</h2>
      ${full ? `<p class="msg success" style="margin-top:-6px;">Full advert saved (${wordCount(job.full_description)} words).</p>
        <details><summary>Show the saved advert</summary><div class="pre muted">${esc(job.full_description)}</div></details>`
      : `<p class="msg warn" style="margin-top:-6px;">Only the short listing is saved. Analysing reads the full advert first.</p>`}
      <details id="pasteWrap" ${full ? "" : ""}>
        <summary>${full ? "Replace with a pasted copy" : "Paste the advert yourself"}</summary>
        <textarea id="pasteText" rows="10" placeholder="Paste the whole advert, including the person specification"></textarea>
        <label for="pasteFile">Or add the job description / person specification document</label>
        <input type="file" id="pasteFile" accept=".pdf,.docx,.txt" />
        <div id="attachments"></div>
        <button class="secondary" id="pasteSave">Save this text</button>
      </details>
      <div class="msg hidden" id="advertMsg"></div>
    </div>

    <div class="card" id="analysisCard">
      <h2>Analysis</h2>
      ${assess ? `
        <div class="row">${chip(ELIG, assess.eligibility)} ${chip(REC, assess.recommendation)}</div>
        <div class="scores">
          <div class="score"><div class="num">${assess.fit_score ?? "—"}${assess.fit_score !== null && assess.fit_score !== undefined ? "%" : ""}</div><div class="lbl">Fit</div></div>
          <div class="score"><div class="num">${assess.essential_score ?? "—"}${assess.essential_score !== null && assess.essential_score !== undefined ? "%" : ""}</div><div class="lbl">Essentials</div></div>
          <div class="score"><div class="num">${pkg?.readiness_score ?? "—"}${pkg?.readiness_score !== null && pkg?.readiness_score !== undefined ? "%" : ""}</div><div class="lbl">Readiness</div></div>
        </div>
        ${summary ? `<p class="msg">${esc(summary)}</p>` : ""}
        ${reasons.length ? `<h3 style="margin-top:14px;">Eligibility checks</h3>${reasons.map((r) => `<div class="crit"><span class="chip ${r.result === "pass" ? "good" : r.result === "review" ? "warn" : "bad"}">${esc(r.result === "pass" ? "OK" : r.result === "review" ? "Check" : "No")}</span><div><strong>${esc(r.check)}</strong><div class="note" style="color:inherit;">${esc(r.detail)}</div></div></div>`).join("")}` : ""}
        ${results.length ? `<h3 style="margin-top:14px;">Criteria</h3>${results.map((r) => `
          <div class="crit">${chip(RATING, r.rating)}<div>${r.kind === "desirable" ? '<span class="muted small-text">Desirable · </span>' : ""}${esc(r.text)}</div>
          <div class="note">${esc(r.note || "")}${r.evidence_labels && r.evidence_labels.length ? ` Evidence: ${esc(r.evidence_labels.join("; "))}` : ""}</div></div>`).join("")}` : ""}
        <p class="msg muted small-text">Analysed ${esc(timeAgo(assess.assessed_at))}. Scores are worked out from the ratings above, not guessed.</p>
      ` : `<p class="msg" style="margin-top:-6px;">Checks the hard requirements first (closing date, sponsorship, registration, licence, clearance), then rates every criterion against your evidence.</p>`}
      <button class="${assess ? "secondary" : ""}" id="analyseBtn">${assess ? "Re-analyse (1 credit)" : "Analyse this job (1–2 credits)"}</button>
      <div class="msg hidden" id="analyseMsg"></div>
    </div>

    ${assess ? `
    <div class="card" id="buildCard">
      <h2>Application</h2>
      ${pkg ? `<div class="row">${chip(PKG, pkg.status)}<span class="msg" style="margin:0;">Readiness ${esc(pkg.readiness_score ?? "—")}% · updated ${esc(timeAgo(pkg.updated_at))}</span></div>
        <button id="openPkg">Open the application</button>` : ""}
      ${assess.recommendation === "skip" ? `<p class="msg warn">The analysis says skip${assess.eligibility === "fail" ? " because an eligibility check failed" : ""}. You can still build it if you disagree.</p>` : ""}
      <label for="whyNote">${pkg ? "Rebuild it. " : ""}Why do you want this job? A sentence or two, in your words (optional but makes the opening yours)</label>
      <textarea id="whyNote" rows="3" maxlength="600"></textarea>
      <button class="${pkg ? "secondary" : "brass"}" id="buildBtn">${pkg ? "Rebuild application (2 credits)" : "Build application (2 credits)"}</button>
      <div class="msg hidden" id="buildMsg"></div>
      <p class="msg muted small-text">Writes only what this form asks for (${esc(crit?.application_type === "personal_statement_behaviours" ? "personal statement, behaviours, job history" : crit?.application_type === "cv_cover_letter" ? "cover letter and tailored CV" : "supporting information and job history duties")}), from your Evidence Bank, then checks it like a shortlister would.</p>
    </div>` : ""}`;

  const $ = (id) => document.getElementById(id);

  if ($("openPkg")) $("openPkg").addEventListener("click", () => { window.location.hash = `package/${pkg.id}`; });

  $("pasteFile").addEventListener("change", async () => {
    const file = $("pasteFile").files[0];
    if (!file) return;
    try {
      const text = await extractTextFromFile(file);
      $("pasteText").value = ($("pasteText").value.trim() + "\n\n" + text).trim();
      showMsg($("advertMsg"), `Added ${wordCount(text)} words from ${file.name}. Press Save.`, "success");
    } catch (err) {
      showMsg($("advertMsg"), err.message, "error");
    }
  });

  $("pasteSave").addEventListener("click", async () => {
    const text = $("pasteText").value.trim();
    if (wordCount(text) < 40) return showMsg($("advertMsg"), "Paste the whole advert first.", "error");
    $("pasteSave").disabled = true;
    try {
      await engine("capture_job", { job_id: job.id, text });
      showMsg($("advertMsg"), "Saved.", "success");
      const here = window.location.hash;
      setTimeout(() => { if (window.location.hash === here) render(); }, 500);
    } catch (err) {
      showMsgHtml($("advertMsg"), errorHtml(err), "error");
      $("pasteSave").disabled = false;
    }
  });

  $("analyseBtn").addEventListener("click", async () => {
    const btn = $("analyseBtn");
    const msg = $("analyseMsg");
    btn.disabled = true;
    try {
      if (!full) {
        showMsg(msg, "Reading the full advert...");
        const d = await engine("fetch_detail", { job_id: job.id });
        if (!d.ok) {
          showMsg(msg, d.message, "warn");
          $("pasteWrap").open = true;
          btn.disabled = false;
          return;
        }
        if (d.attachments && d.attachments.length) {
          setFlash(`This advert has ${d.attachments.length} attached document(s), usually the job description and person specification. For a stronger match, download them and add them under "The advert", then re-analyse.`, "info");
        }
      }
      showMsg(msg, "Checking eligibility and scoring each criterion (about 30 seconds)...");
      await engine("assess", { job_id: job.id });
      render();
    } catch (err) {
      if (err.code === "needs_full_advert") {
        showMsg(msg, err.message, "warn");
        $("pasteWrap").open = true;
      } else showMsgHtml(msg, errorHtml(err), "error");
      btn.disabled = false;
    }
  });

  if ($("buildBtn")) {
    $("buildBtn").addEventListener("click", async () => {
      const btn = $("buildBtn");
      const msg = $("buildMsg");
      btn.disabled = true;
      showMsg(msg, "Writing each part from your evidence, then checking it (about 1 minute)...");
      try {
        const r = await engine("build_package", { job_id: job.id, why_note: $("whyNote").value.trim() });
        window.location.hash = `package/${r.package.id}`;
      } catch (err) {
        showMsgHtml(msg, errorHtml(err), "error");
        btn.disabled = false;
      }
    });
  }
}

function progressOf(pkg) {
  const sections = (pkg.sections || []).filter((s) => s.kind !== "list");
  const states = pkg.progress?.sections || {};
  const done = sections.filter((s) => states[s.key]?.state === "done").length;
  return { done, total: sections.length };
}

async function renderQueue(user) {
  const [{ data: profile }, { data: pkgs }, { data: legacy }] = await Promise.all([
    sb.from("profiles").select("resume_text").eq("id", user.id).maybeSingle(),
    sb.from("application_packages").select("id,status,readiness_score,updated_at,progress,sections,qa_stale,jobs(title,company,closing_date,url)").eq("user_id", user.id).order("updated_at", { ascending: false }),
    sb.from("job_matches").select("*, jobs(title, company, location, url)").eq("user_id", user.id).not("tailored_resume", "is", null).order("prepared_at", { ascending: false }),
  ]);
  const resumeText = profile?.resume_text || "";
  const list = pkgs || [];

  app.innerHTML = `
    ${topbar("Applications")}
    ${list.length ? list.map((p) => {
      const pr = progressOf(p);
      return `
        <div class="card">
          <div class="row between"><h2 style="margin:0;">${esc(p.jobs?.title || "Untitled")}</h2>${chip(PKG, p.status)}</div>
          <p class="msg" style="margin-top:4px;">${esc(p.jobs?.company || "")}${p.jobs?.closing_date ? ` · closes ${esc(fmtDate(p.jobs.closing_date))}` : ""}</p>
          <div class="kv"><span>Readiness</span><span>${esc(p.readiness_score ?? "—")}%</span></div>
          <div class="kv"><span>Sections done</span><span>${pr.done} of ${pr.total}</span></div>
          ${p.progress?.last_device ? `<div class="kv"><span>Last worked on</span><span>${esc(p.progress.last_device)}, ${esc(timeAgo(p.progress.updated_at))}</span></div>` : ""}
          ${p.qa_stale ? `<p class="msg warn">Edited since the last check.</p>` : ""}
          <button class="small" data-nav="package/${esc(p.id)}">Open</button>
        </div>`;
    }).join("") : `<div class="card"><p class="msg">No applications yet. <a class="plain" href="#jobs">Find a job</a>, analyse it, then build the application.</p></div>`}

    <div class="card">
      <h2>Answer from screenshots</h2>
      <p class="msg" style="margin-top:-6px;">For a form question Career Bridge hasn't prepared: screenshot it (up to 5 images) and get a draft answer from your CV. Declarations and personal questions are left for you.</p>
      <input type="file" id="screenshotInput" accept="image/*" multiple />
      <p class="msg" id="screenshotCount"></p>
      <button class="secondary" id="analyzeScreenshotsBtn">Analyse screenshots (1 credit)</button>
      <div class="msg hidden" id="screenshotMsg"></div>
      <div id="screenshotResults"></div>
    </div>

    ${(legacy || []).length ? `
    <div class="card">
      <details><summary>Older prepared applications (${legacy.length})</summary>
        ${legacy.map((m) => {
          let answers = {};
          try { answers = JSON.parse(m.application_answers || "{}"); } catch { answers = {}; }
          return `<div class="list-item">
            <strong>${esc(m.jobs?.title || "Untitled")}</strong> <span class="muted small-text">${esc(m.jobs?.company || "")}</span>
            <div class="row" style="margin-top:6px;">
              ${m.tailored_resume ? copyBtn(m.tailored_resume, "Copy CV") : ""}
              ${m.cover_letter ? copyBtn(m.cover_letter, "Copy cover letter") : ""}
              ${Object.entries(answers).filter(([, v]) => v).map(([k, v]) => copyBtn(v, k.replace(/_/g, " "))).join("")}
              ${m.jobs?.url ? `<a class="plain small-text" href="${esc(safeUrl(m.jobs.url))}" target="_blank" rel="noopener">Listing →</a>` : ""}
            </div>
          </div>`;
        }).join("")}
      </details>
    </div>` : ""}`;

  const input = document.getElementById("screenshotInput");
  input.addEventListener("change", () => {
    const n = input.files.length;
    showMsg(document.getElementById("screenshotCount"), n > 5 ? `${n} selected. Choose 5 or fewer.` : n ? `${n} image${n > 1 ? "s" : ""} selected.` : "", n > 5 ? "error" : "");
  });
  document.getElementById("analyzeScreenshotsBtn").addEventListener("click", async () => {
    const files = Array.from(input.files);
    const msg = document.getElementById("screenshotMsg");
    const out = document.getElementById("screenshotResults");
    const btn = document.getElementById("analyzeScreenshotsBtn");
    if (!resumeText) return showMsgHtml(msg, 'No CV text saved yet. Upload your CV on the <a class="plain" href="#profile">Profile</a> page first.', "error");
    if (!files.length) return showMsg(msg, "Choose at least one screenshot.", "error");
    if (files.length > 5) return showMsg(msg, "Choose 5 or fewer images.", "error");
    btn.disabled = true;
    showMsg(msg, "Reading the screenshots...");
    out.innerHTML = "";
    try {
      const images = await Promise.all(files.map((f) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(f);
      })));
      const data = await callFunction("tailor-resume", { action: "answer_from_screenshots", resumeText, images });
      msg.classList.add("hidden");
      let parsed;
      try { parsed = JSON.parse(data.result); } catch { parsed = null; }
      if (!parsed) {
        out.innerHTML = `<div class="card flat"><p class="pre">${esc(data.result)}</p></div>`;
      } else {
        out.innerHTML = (parsed.answers || []).map((a) => `
          <div class="card flat">
            <p class="small-text muted" style="margin:0 0 4px;"><strong>${esc(a.question)}</strong></p>
            <p class="pre" style="margin:0 0 8px;">${esc(a.answer)}</p>
            ${copyBtn(a.answer)}
          </div>`).join("");
      }
    } catch (err) {
      showMsgHtml(msg, errorHtml(err), "error");
    }
    btn.disabled = false;
  });
}

async function renderPackage(user, pkgId) {
  app.innerHTML = `${topbar("Application", "queue")}<div id="pkgBody"><p class="msg">Loading...</p></div>`;
  const [{ data: pkg }, { data: profile }, { data: employment }] = await Promise.all([
    sb.from("application_packages").select("*, jobs(id,title,company,url,closing_date)").eq("id", pkgId).maybeSingle(),
    sb.from("profiles").select("*").eq("id", user.id).maybeSingle(),
    sb.from("employment_history").select("*").eq("user_id", user.id).order("is_current", { ascending: false }).order("start_date", { ascending: false, nullsFirst: false }),
  ]);
  const body = document.getElementById("pkgBody");
  if (!pkg) {
    body.innerHTML = `<div class="card"><p class="msg error">That application wasn't found.</p></div>`;
    return;
  }
  const qa = pkg.qa || {};
  const checks = qa.checks || [];
  const fails = checks.filter((c) => c.status === "fail");
  const warns = checks.filter((c) => c.status === "warn");
  const passes = checks.filter((c) => c.status === "pass");
  const sections = pkg.sections || [];
  const states = () => pkg.progress?.sections || {};
  const p = profile || {};
  const nameParts = String(p.full_name || "").trim().split(/\s+/);
  const first = nameParts.length > 1 ? nameParts.slice(0, -1).join(" ") : nameParts[0] || "";
  const last = nameParts.length > 1 ? nameParts[nameParts.length - 1] : "";
  const limitText = (s) => {
    const parts = [];
    if (s.word_limit) parts.push(`<span data-wc="${esc(s.key)}">${wordCount(s.text)}</span> / ${esc(s.word_limit)} words`);
    else parts.push(`<span data-wc="${esc(s.key)}">${wordCount(s.text)}</span> words`);
    if (s.char_limit) parts.push(`<span data-cc="${esc(s.key)}">${String(s.text || "").length}</span> / ${esc(s.char_limit)} characters`);
    return parts.join(" · ");
  };
  const stateChip = (key) => {
    const st = states()[key];
    if (!st) return `<span class="chip plain" data-state="${esc(key)}">To do</span>`;
    const label = st.state === "done" ? "Done" : st.state === "filled" ? "Filled" : "To do";
    const cls = st.state === "done" ? "good" : st.state === "filled" ? "info" : "plain";
    return `<span class="chip ${cls}" data-state="${esc(key)}">${label}${st.by && st.state !== "todo" ? ` · ${esc(st.by)}` : ""}</span>`;
  };
  const pr = progressOf(pkg);
  const recruiter = qa.recruiter;

  body.innerHTML = `
    <div class="card">
      <p class="eyebrow">${esc(pkg.application_type === "personal_statement_behaviours" ? "Civil Service application" : pkg.application_type === "cv_cover_letter" ? "CV and cover letter" : "NHS-style application")}</p>
      <h1 style="font-size:22px;">${esc(pkg.jobs?.title || "Application")}</h1>
      <p class="msg" style="margin-top:2px;">${esc(pkg.jobs?.company || "")}${pkg.jobs?.closing_date ? ` · closes ${esc(fmtDate(pkg.jobs.closing_date))}` : ""}</p>
      <div class="row" style="margin-top:8px;" id="statusRow">${chip(PKG, pkg.status)} <span class="chip plain" id="progressChip">${pr.done} of ${pr.total} done</span></div>
      <div class="scores">
        <div class="score"><div class="num">${esc(pkg.readiness_score ?? "—")}%</div><div class="lbl">Readiness</div></div>
        <div class="score"><div class="num">${esc(qa.recruiter_score ?? "—")}${qa.recruiter_score !== null && qa.recruiter_score !== undefined ? "%" : ""}</div><div class="lbl">Shortlister</div></div>
        <div class="score"><div class="num">${esc(qa.compliance_score ?? "—")}${qa.compliance_score !== null && qa.compliance_score !== undefined ? "%" : ""}</div><div class="lbl">Rules</div></div>
      </div>
      <div id="syncBanner"></div>
      ${pkg.qa_stale ? `<div class="banner warn" id="staleBanner">You've edited this since the last check. Re-check before you submit.</div>` : ""}
      <div class="row" style="margin-top:10px;">
        <a class="plain" href="${esc(safeUrl(pkg.jobs?.url))}" target="_blank" rel="noopener">Open the job site →</a>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="secondary small" id="recheckBtn">Re-check (1 credit)</button>
        <button class="secondary small" data-nav="job/${esc(pkg.job_id)}">Back to analysis</button>
        ${pkg.status !== "submitted" ? `<button class="small" id="submittedBtn">I've submitted it</button>` : ""}
      </div>
      <div class="msg hidden" id="pkgMsg"></div>
      <p class="msg muted small-text">On your laptop, the Career Bridge extension fills these into the form for you. On your phone, use the Copy buttons. Either way, you press Submit on the job site yourself.</p>
    </div>

    <div class="card">
      <h2>Checks</h2>
      ${fails.map((c) => `<div class="crit"><span class="chip bad">Fix</span><div><strong>${esc(c.name)}</strong><div class="note" style="color:inherit;">${esc(c.detail)}</div></div></div>`).join("")}
      ${warns.map((c) => `<div class="crit"><span class="chip warn">Check</span><div><strong>${esc(c.name)}</strong><div class="note" style="color:inherit;">${esc(c.detail)}</div></div></div>`).join("")}
      ${(qa.unsupported || []).map((u) => `<div class="crit"><span class="chip bad">Claim</span><div>"${esc(u.sentence)}"<div class="note">${esc(u.reason)}</div></div></div>`).join("")}
      ${(qa.warnings || []).map((w) => `<div class="crit"><span class="chip plain">Note</span><div class="small-text">${esc(w)}</div></div>`).join("")}
      ${passes.length ? `<details style="margin-top:10px;"><summary>${passes.length} checks passed</summary>${passes.map((c) => `<div class="crit"><span class="chip good">OK</span><div class="small-text"><strong>${esc(c.name)}</strong> ${esc(c.detail)}</div></div>`).join("")}</details>` : ""}
      ${recruiter ? `<details style="margin-top:10px;"><summary>How a shortlister would score it</summary>
        ${(recruiter.criteria || []).map((r) => `<div class="crit"><span class="chip ${r.score >= 5 ? "good" : r.score >= 3 ? "warn" : "bad"}">${esc(r.score)}/7</span><div class="small-text">${r.kind === "desirable" ? "Desirable · " : ""}${esc(r.text)}<div class="note">${esc(r.comment || "")}</div></div></div>`).join("")}
        ${(recruiter.behaviours || []).map((b) => `<div class="crit"><span class="chip ${b.score >= 5 ? "good" : b.score >= 3 ? "warn" : "bad"}">${esc(b.score)}/7</span><div class="small-text">Behaviour: ${esc(b.name)}<div class="note">${esc(b.comment || "")}</div></div></div>`).join("")}
        ${recruiter.overall ? `<p class="msg">${esc(recruiter.overall)}</p>` : ""}
      </details>` : ""}
    </div>

    ${sections.map((s) => `
      <div class="card" data-section="${esc(s.key)}">
        <div class="row between"><h3 style="margin:0;">${esc(s.label)}</h3>${s.kind !== "list" ? stateChip(s.key) : ""}</div>
        ${s.kind === "duties" ? `<p class="msg muted small-text" style="margin-top:4px;">${esc(s.job_title)} · ${esc(s.employer)} · ${esc(fmtMonth(s.start) || "?")} to ${s.is_current ? "present" : esc(fmtMonth(s.end) || "?")}</p>` : ""}
        <p class="msg muted small-text" style="margin-top:4px;">${limitText(s)}</p>
        <textarea class="section-text" data-text="${esc(s.key)}" rows="${Math.min(22, Math.max(5, Math.ceil(String(s.text || "").length / 70)))}">${esc(s.text)}</textarea>
        <div class="row" style="margin-top:8px;">
          <button type="button" class="secondary small" data-copy-section="${esc(s.key)}">Copy</button>
          <button type="button" class="small hidden" data-save="${esc(s.key)}">Save edit</button>
          ${s.kind !== "list" ? `<button type="button" class="secondary small" data-done="${esc(s.key)}">${states()[s.key]?.state === "done" ? "Mark not done" : "Mark done"}</button>` : ""}
        </div>
        <div class="msg hidden" data-msg="${esc(s.key)}"></div>
      </div>`).join("")}

    <div class="card">

  const $ = (id) => document.getElementById(id);
  const current = new Map(sections.map((s) => [s.key, s.text || ""]));
  const dirty = new Set();

  document.querySelectorAll("[data-text]").forEach((ta) => ta.addEventListener("input", () => {
    const key = ta.dataset.text;
    const wc = document.querySelector(`[data-wc="${CSS.escape(key)}"]`);
    if (wc) wc.textContent = wordCount(ta.value);
    const cc = document.querySelector(`[data-cc="${CSS.escape(key)}"]`);
    if (cc) cc.textContent = ta.value.length;
    const changed = ta.value !== current.get(key);
    document.querySelector(`[data-save="${CSS.escape(key)}"]`).classList.toggle("hidden", !changed);
    if (changed) dirty.add(key); else dirty.delete(key);
  }));

  document.querySelectorAll("[data-copy-section]").forEach((b) => b.addEventListener("click", async () => {
    const ta = document.querySelector(`[data-text="${CSS.escape(b.dataset.copySection)}"]`);
    const ok = await copyText(ta.value);
    b.textContent = ok ? "Copied ✓" : "Copy failed";
    setTimeout(() => { b.textContent = "Copy"; }, 1400);
  }));

  document.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", async () => {
    const key = b.dataset.save;
    const ta = document.querySelector(`[data-text="${CSS.escape(key)}"]`);
    const msg = document.querySelector(`[data-msg="${CSS.escape(key)}"]`);
    b.disabled = true;
    const { error } = await sb.rpc("cb_update_section_text", { p_package: pkg.id, p_key: key, p_text: ta.value });
    b.disabled = false;
    if (error) return showMsg(msg, error.message, "error");
    current.set(key, ta.value);
    dirty.delete(key);
    b.classList.add("hidden");
    showMsg(msg, "Saved. Re-check before you submit.", "success");
    if (!$("staleBanner")) $("syncBanner").insertAdjacentHTML("afterend", `<div class="banner warn" id="staleBanner">You've edited this since the last check. Re-check before you submit.</div>`);
  }));

  document.querySelectorAll("[data-done]").forEach((b) => b.addEventListener("click", async () => {
    const key = b.dataset.done;
    const isDone = states()[key]?.state === "done";
    b.disabled = true;
    const { data, error } = await sb.rpc("cb_set_section_state", { p_package: pkg.id, p_key: key, p_state: isDone ? "todo" : "done", p_device: DEVICE });
    b.disabled = false;
    if (error) return showMsg(document.querySelector(`[data-msg="${CSS.escape(key)}"]`), error.message, "error");
    pkg.progress = data;
    refreshStates();
  }));

  function refreshStates() {
    document.querySelectorAll("[data-state]").forEach((el) => {
      const tmp = document.createElement("div");
      tmp.innerHTML = stateChip(el.dataset.state);
      el.replaceWith(tmp.firstElementChild);
    });
    document.querySelectorAll("[data-done]").forEach((b) => {
      b.textContent = states()[b.dataset.done]?.state === "done" ? "Mark not done" : "Mark done";
    });
    const pr2 = progressOf(pkg);
    $("progressChip").textContent = `${pr2.done} of ${pr2.total} done`;
  }

  $("recheckBtn").addEventListener("click", async () => {
    const msg = $("pkgMsg");
    if (dirty.size) return showMsg(msg, "Save your edits first (Save edit under each changed section).", "warn");
    $("recheckBtn").disabled = true;
    showMsg(msg, "Re-checking like a shortlister would (about 20 seconds)...");
    try {
      await engine("qa_package", { package_id: pkg.id });
      render();
    } catch (err) {
      showMsgHtml(msg, errorHtml(err), "error");
      $("recheckBtn").disabled = false;
    }
  });

  if ($("submittedBtn")) {
    $("submittedBtn").addEventListener("click", async () => {
      if (!confirm("Only do this after you've pressed Submit on the job site yourself. Mark as submitted?")) return;
      const { error } = await sb.rpc("cb_set_package_status", { p_package: pkg.id, p_status: "submitted" });
      if (error) return showMsg($("pkgMsg"), error.message, "error");
      render();
    });
  }

  // Keep in step with your other device (phone / laptop / extension).
  let lastUpdated = pkg.updated_at;
  const sync = async () => {
    const { data } = await sb.from("application_packages").select("progress,status,updated_at,sections,qa_stale").eq("id", pkg.id).maybeSingle();
    if (!data) return;
    const textChanged = JSON.stringify((data.sections || []).map((s) => s.text)) !== JSON.stringify(sections.map((s) => current.get(s.key) ?? s.text));
    pkg.progress = data.progress;
    refreshStates();
    if (data.updated_at !== lastUpdated && textChanged && !dirty.size) {
      $("syncBanner").innerHTML = `<div class="banner info">Updated on another device. <a class="plain" href="#" id="reloadPkg">Reload</a></div>`;
      document.getElementById("reloadPkg").addEventListener("click", (e) => { e.preventDefault(); render(); });
    }
    lastUpdated = data.updated_at;
  };
  pollTimer = setInterval(sync, 20000);
  onVisible = () => { if (document.visibilityState === "visible") sync(); };
  document.addEventListener("visibilitychange", onVisible);
}

const STATUSES = [
  { key: "new", label: "Saved / scored" },
  { key: "applied", label: "Applied" },
  { key: "interview", label: "Interview" },
  { key: "reserve", label: "Reserve list" },
  { key: "offer", label: "Offer" },
  { key: "rejected", label: "Rejected" },
  { key: "withdrawn", label: "Withdrawn" },
];

function outcomeStats(matches) {
  const submitted = matches.filter((m) => ["applied", "interview", "reserve", "offer", "rejected", "withdrawn"].includes(m.status || "new"));
  const bands = [
    { label: "85–100", min: 85, max: 100 },
    { label: "70–84", min: 70, max: 84 },
    { label: "55–69", min: 55, max: 69 },
    { label: "Under 55", min: 0, max: 54 },
  ];
  const interviewed = (m) => ["interview", "reserve", "offer"].includes(m.status);
  const rows = bands.map((b) => {
    const inBand = submitted.filter((m) => m.overall_score !== null && m.overall_score !== undefined && m.overall_score >= b.min && m.overall_score <= b.max);
    const hits = inBand.filter(interviewed).length;
    return { ...b, n: inBand.length, hits, rate: inBand.length ? Math.round((hits / inBand.length) * 100) : null };
  });
  const total = submitted.length;
  const hits = submitted.filter(interviewed).length;
  return { rows, total, hits, rate: total ? Math.round((hits / total) * 100) : null };
}

const PLANS = [
  { key: "basic", label: "Basic", price: 5000, amountKobo: 500000 },
  { key: "pro", label: "Pro", price: 15000, amountKobo: 1500000 },
  { key: "premium", label: "Premium", price: 30000, amountKobo: 3000000 },
];
const DISPLAY_CURRENCIES = [{ code: "USD", symbol: "$" }, { code: "GBP", symbol: "£" }, { code: "EUR", symbol: "€" }];

async function getNgnRates() {
  const cacheKey = "cb_ngn_rates";
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (cached && Date.now() - cached.fetchedAt < 12 * 60 * 60 * 1000) return cached.rates;
  } catch { /* ignore */ }
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/NGN");
    const data = await res.json();
    const rates = data?.rates || null;
    if (rates) { try { localStorage.setItem(cacheKey, JSON.stringify({ rates, fetchedAt: Date.now() })); } catch { /* ignore */ } }
    return rates;
  } catch { return null; }
}
function formatConversions(ngnAmount, rates) {
  if (!rates) return "";
  return DISPLAY_CURRENCIES.map((c) => {
    const rate = rates[c.code];
    if (!rate) return null;
    const v = ngnAmount * rate;
    return `${c.symbol}${v.toLocaleString(undefined, { maximumFractionDigits: v < 10 ? 2 : 0 })}`;
  }).filter(Boolean).join(" · ");
}

async function renderBilling(user) {
  const [usage, { data: limits }, rates] = await Promise.all([
    myUsage(),
    sb.from("plan_limits").select("*"),
    getNgnRates(),
  ]);
  const limitOf = (k) => {
    const row = (limits || []).find((l) => l.plan === k);
    return row ? (row.monthly_credits === null ? "Unlimited" : `${row.monthly_credits}`) : "—";
  };
  const currentPlan = usage?.plan || "free";
  app.innerHTML = `
    ${topbar("Billing")}
    <div class="card">
      <h2>Current plan: ${esc(currentPlan.charAt(0).toUpperCase() + currentPlan.slice(1))}</h2>
      <p class="msg">${esc(usageText(usage))}</p>
      <p class="msg muted small-text">What uses credits: analysing a job 1–2, building an application 2, re-checking 1, CV import 1, each quick tool 1.</p>
    </div>
    ${PLANS.map((p) => `
      <div class="card">
        <h2>${esc(p.label)} — ₦${p.price.toLocaleString()}/month</h2>
        ${rates ? `<p class="msg muted">≈ ${esc(formatConversions(p.price, rates))} /month</p>` : ""}
        <p class="msg">${esc(limitOf(p.key))} AI credits per month</p>
        <button class="upgrade-btn" data-plan="${p.key}" data-amount="${p.amountKobo}" ${currentPlan === p.key ? "disabled" : ""}>${currentPlan === p.key ? "Current Plan" : "Upgrade"}</button>
      </div>`).join("")}
    <p class="msg muted" style="text-align:center;">Charged in Nigerian Naira (NGN) via Paystack. Other currencies are approximate.</p>
    <div class="msg hidden" id="billingMsg"></div>`;

  document.querySelectorAll(".upgrade-btn").forEach((btn) => btn.addEventListener("click", () => startCheckout(btn.dataset.amount)));
  function startCheckout(amountKobo) {
    if (PAYSTACK_PUBLIC_KEY.startsWith("YOUR_")) {
      showMsg(document.getElementById("billingMsg"), "Payments aren't switched on yet (the Paystack public key hasn't been added).", "error");
      return;
    }
    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: user.email,
      amount: Number(amountKobo),
      currency: "NGN",
      ref: "cb_" + Date.now(),
      callback: (response) => verifyPayment(response.reference),
      onClose: () => {},
    });
    handler.openIframe();
  }
  async function verifyPayment(reference) {
    const msg = document.getElementById("billingMsg");
    showMsg(msg, "Verifying payment...");
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(VERIFY_PAYMENT_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ reference }),
      });
      const data = await res.json();
      if (data.error) return showMsg(msg, data.error, "error");
      showMsg(msg, `Upgraded to ${data.plan}!`, "success");
      setTimeout(() => renderBilling(user), 1000);
    } catch (err) {
      showMsg(msg, "Verification failed: " + err.message, "error");
    }
  }
}

  const rates = await getNgnRates();

  const total = (payments || []).reduce((s, p) => s + (p.amount_kobo || 0), 0) / 100;
  const month = (payments || []).filter((p) => new Date(p.created_at) >= startOfMonth).reduce((s, p) => s + (p.amount_kobo || 0), 0) / 100;

      <div class="card"><h2 class="muted" style="font-size:14px;">This month</h2><p class="display" style="font-size:24px;margin:0;">₦${month.toLocaleString()}</p>${rates ? `<p class="msg muted">≈ ${esc(formatConversions(month, rates))}</p>` : ""}</div>
    </div>
    <div class="card"><h2>Plan breakdown</h2>${Object.entries(planCounts).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("") || '<p class="msg">No subscriptions yet</p>'}</div>
    <div class="card"><h2>AI credits used this month: ${esc(credits)}</h2>${Object.entries(byAction).filter(([, v]) => v > 0).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}</div>`;

  if (!(await requireAdmin(user))) return;
  app.innerHTML = `
    ${topbar("CV Bank", "admin")}
    <div class="card">
      <h2>Add a CV</h2>
      ${field("cvLabel", "Label (e.g. candidate name or role)", "", "text", 'placeholder="e.g. Jane Doe — Accountant"')}
      <label for="cvFile">CV file (PDF or DOCX)</label>
      <input type="file" id="cvFile" accept=".pdf,.docx,.txt" />
